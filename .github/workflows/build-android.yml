name: Build Pictures Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install npm dependencies
        run: npm install --legacy-peer-deps

      - name: Generate native Android project
        run: npx expo prebuild --platform android --no-install

      - name: Make gradlew executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Raise Gradle JVM heap
        working-directory: android
        run: |
          sed -i '/^org.gradle.jvmargs/d' gradle.properties || true
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8" >> gradle.properties
          echo "--- gradle.properties ---"
          cat gradle.properties

      - name: Build debug APK
        working-directory: android
        env:
          GRADLE_OPTS: "-Xmx6g -Dorg.gradle.daemon=false"
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pictures-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
